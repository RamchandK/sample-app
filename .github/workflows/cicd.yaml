name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Test
      run: |
        python -m py_compile app.py


    - name: Login GHCR
      uses: docker/login-action@v3

      with:
        registry: ghcr.io
        username: ramchandk
        password: ${{ secrets.GHCR_TOKEN }}


    - name: Build image
      run: |
        docker build \
        -t ghcr.io/ramchandk/sample:${{ github.sha }} \
        -t ghcr.io/ramchandk/sample:latest .


    - name: Push SHA image
      run: |
        docker push \
        ghcr.io/ramchandk/sample:${{ github.sha }}


    - name: Push latest image
      run: |
        docker push \
        ghcr.io/ramchandk/sample:latest
