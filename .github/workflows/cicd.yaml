name: Build

on:

 push:

  branches:
   - main

jobs:

 build:

   runs-on: ubuntu-latest

   steps:

   - uses: actions/checkout@v4


   - name: Install Python

     uses: actions/setup-python@v5


   - name: Install deps

     run: |

       pip install -r requirements.txt


   - name: Test

     run: |

       python -m py_compile app.py


   - name: Login GHCR

     run: |

       echo "${{ secrets.GHCR_TOKEN }}" |

       docker login ghcr.io \
       -u ramchandk \
       --password-stdin


   - name: Build image

     run: |

       docker build \
       -t ghcr.io/ramchandk/sample:${{ github.sha }} .


   - name: Push image

     run: |

       docker push \
     ghcr.io/ramchandk/sample:latest
